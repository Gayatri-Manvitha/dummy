server.port=8080
spring.application.name=arch-helper

# Allow large repos to be cloned/analyzed
analysis.clone-timeout-seconds=120
analysis.max-files=20000
analysis.max-file-size-bytes=2000000

# Multipart not needed; keep request size generous for JSON
server.tomcat.max-http-form-post-size=10MB
logging.level.com.archhelper=INFO
